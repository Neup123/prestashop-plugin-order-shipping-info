name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php
      - name: Lint PHP
        run: find grtransportshipping tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Quote engine tests
        run: php tests/quote_check_test.php && php tests/quote_page_test.php && php tests/network_branch_test.php && php tests/network_freshness_test.php && php tests/network_timing_test.php && php tests/network_settings_test.php && php tests/network_test.php && php tests/network_quote_test.php && php tests/network_tariff_test.php && php tests/quote_test.php && php tests/demo_quotes_test.php && php tests/route_state_test.php && php tests/route_fields_test.php && php tests/translation_test.php
      - name: Order charged amount adjustment contract
        run: php tests/order_charge_test.php
      - name: Validate demo seed format
        run: php tests/seed_test.php
      - name: Quote map interaction contracts
        run: node tests/quote_map_test.mjs
