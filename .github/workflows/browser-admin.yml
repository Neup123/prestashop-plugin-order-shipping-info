name: Browser admin acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start PrestaShop and database
        run: docker compose -f tests/compose.yml up -d
      - name: Wait for fully served PrestaShop frontend
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -fLsS --max-time 8 http://localhost:8080/ -o /dev/null 2>/dev/null; then
              echo "PrestaShop HTTP frontend is serving requests"
              exit 0
            fi
            sleep 5
          done
          echo "PrestaShop frontend never became available" >&2
          exit 1
      - name: Ensure Greek Symfony translation cache is writable
        # Docker's root auto-installer can own untranslated cache directories;
        # the customer frontend creates el-GR catalogues as www-data.
        run: docker compose -f tests/compose.yml exec -T prestashop chown -R www-data:www-data /var/www/html/var/cache
      - name: Install module and locate admin editor
        run: |
          set -euo pipefail
          docker compose -f tests/compose.yml exec -T -u www-data prestashop php bin/console prestashop:module install grtransportshipping
          # The core CLI can boot while the Docker auto-installer is still
          # finishing its employee/customer fixtures.
          for i in $(seq 1 90); do
            EMPLOYEES="$(docker compose -f tests/compose.yml exec -T mysql mariadb -N -uroot -pci_demo_password prestashop -e 'SELECT COUNT(*) FROM ps_employee' 2>/dev/null || true)"
            if [[ "$EMPLOYEES" =~ ^[1-9][0-9]*$ ]]; then break; fi
            sleep 10
          done
          [ "${EMPLOYEES:-0}" -gt 0 ]
          docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/admin-url.php > /tmp/grtrans-admin-url
      - name: Setup Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify admin route editing in real browser
        env:
          TEST_ADMIN_EMAIL: ci@example.invalid
          TEST_ADMIN_PASSWORD: OnlyForEphemeralCI123!
        run: |
          ADMIN_URL="$(cat /tmp/grtrans-admin-url)" node tests/browser-admin.mjs
      - name: Prepare disposable Greek checkout
        env:
          TEST_CUSTOMER_PASSWORD: BrowserOnlyCiPassword123
        run: |
          docker compose -f tests/compose.yml exec -T -e TEST_CUSTOMER_PASSWORD prestashop php /tmp/browser-checkout-fixtures.php > /tmp/grtrans-browser-fixture.json
          node -e "let f=require('/tmp/grtrans-browser-fixture.json');if(!f.product_url||!f.checkout_url)process.exit(1)"
      - name: Verify customer sees port pickup at checkout
        env:
          TEST_CUSTOMER_PASSWORD: BrowserOnlyCiPassword123
        run: node tests/browser-checkout.mjs
      - if: failure()
        run: docker compose -f tests/compose.yml logs --tail=100
      - if: always()
        run: docker compose -f tests/compose.yml down -v
