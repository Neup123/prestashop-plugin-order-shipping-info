name: PrestaShop 9.2 install
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tests/compose.yml up -d
      - name: Wait for completed PrestaShop HTTP install
        run: |
          set -euo pipefail
          # Do not run PHP CLI before the Docker auto-installer finishes:
          # an early root CLI boot can create unwritable Symfony cache files.
          for i in $(seq 1 120); do
            if curl -fLsS --max-time 8 http://localhost:8080/ -o /dev/null 2>/dev/null; then
              docker compose -f tests/compose.yml exec -T -u www-data prestashop php bin/console about
              exit 0
            fi
            sleep 5
          done
          echo "PrestaShop frontend never became available" >&2
          exit 1
      - name: Install and validate module
        run: |
          set -euo pipefail
          docker compose -f tests/compose.yml exec -T -u www-data prestashop php bin/console prestashop:module install grtransportshipping
          docker compose -f tests/compose.yml exec -T -u www-data prestashop php bin/console prestashop:module:list --simple | grep grtransportshipping
          docker compose -f tests/compose.yml exec -T mysql mariadb -uroot -pci_demo_password prestashop -e "SELECT COUNT(*) AS routes FROM ps_grtrans_route; SELECT COUNT(*) AS carriers FROM ps_carrier WHERE external_module_name='grtransportshipping' AND deleted=0;"
      - name: Verify real Greek delivery addresses and shipping quotes
        run: docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/prestashop-quote-smoke.php
      - name: Verify checkout shipping calculator and delivery options
        run: docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/prestashop-calculator-smoke.php
      - name: Verify saved order pickup snapshots and customer/admin notices
        run: docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/prestashop-order-snapshot-smoke.php
      - name: Validate actual pending-payment PrestaShop order and pickup persistence
        run: docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/prestashop-real-order-smoke.php
      - name: Verify legacy route schema migration and one-time seed marker
        run: docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/prestashop-route-schema-upgrade-smoke.php
      - name: Verify idempotent carrier install and deleted-carrier repair
        run: docker compose -f tests/compose.yml exec -T -u www-data prestashop php /tmp/prestashop-carrier-lifecycle-smoke.php
      - if: failure()
        run: docker compose -f tests/compose.yml logs --tail=150
      - if: always()
        run: docker compose -f tests/compose.yml down -v
