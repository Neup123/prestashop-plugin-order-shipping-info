services:
  mysql:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ci_demo_password
      MARIADB_DATABASE: prestashop
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
  prestashop:
    image: prestashop/prestashop:9.2.x-apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: ci_demo_password
      PS_INSTALL_AUTO: '1'
      PS_DEMO_MODE: '0'
      PS_COUNTRY: gr
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
      ADMIN_MAIL: ci@example.invalid
      ADMIN_PASSWD: 'OnlyForEphemeralCI123!'
    volumes:
      - ../grtransportshipping:/var/www/html/modules/grtransportshipping
      - ./prestashop-quote-smoke.php:/tmp/prestashop-quote-smoke.php:ro
      - ./prestashop-calculator-smoke.php:/tmp/prestashop-calculator-smoke.php:ro
    ports:
      - '8080:80'
